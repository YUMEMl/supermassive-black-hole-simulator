name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Validate
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Release/* -DestinationPath Supermassive-Black-Hole-simulator-Windows.zip
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: Supermassive-Black-Hole-simulator-Windows.zip
          if-no-files-found: error
      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" `
            Supermassive-Black-Hole-simulator-Windows.zip `
            --repo "$env:GITHUB_REPOSITORY" --clobber
